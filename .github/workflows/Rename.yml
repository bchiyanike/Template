name: Rename Template

on:
  workflow_dispatch:
    inputs:
      new_name:
        description: 'New package name segment (e.g., "myapp" for com.lionico.myapp)'
        required: true
      app_name:
        description: 'New App Display Name (e.g., "My Awesome App")'
        required: true
      old_name:
        description: 'Current package name segment to replace'
        required: true
        default: 'template'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Environment
        run: |
          echo "OLD_NAME=${{ github.event.inputs.old_name }}" >> $GITHUB_ENV
          echo "NEW_NAME=${{ github.event.inputs.new_name }}" >> $GITHUB_ENV
          echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
          
          # Prepare capitalized versions for Theme renaming
          OLD_CAP=$(echo "${{ github.event.inputs.old_name }}" | perl -ne 'print ucfirst')
          NEW_CAP=$(echo "${{ github.event.inputs.new_name }}" | perl -ne 'print ucfirst')
          echo "OLD_CAP=$OLD_CAP" >> $GITHUB_ENV
          echo "NEW_CAP=$NEW_CAP" >> $GITHUB_ENV

      - name: Rename Package Strings
        run: |
          echo "=== Replacing package references in files ==="
          # Replace package and import statements
          find . -type f \( -name "*.kt" -o -name "*.kts" -o -name "*.xml" -o -name "*.json" \) -not -path "*/.*" -exec sed -i "s/com\.lionico\.$OLD_NAME/com.lionico.$NEW_NAME/g" {} +
          
          # Replace App Name in strings and settings
          find . -type f -name "strings.xml" -exec sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$APP_NAME<\/string>/g" {} +
          sed -i "s/rootProject\.name = \".*\"/rootProject.name = \"$APP_NAME\"/g" settings.gradle.kts
          
          # Replace Theme names (LionicoTemplateTheme -> LionicoNewNameTheme)
          find . -type f \( -name "*.kt" -o -name "*.xml" \) -exec sed -i "s/Lionico$OLD_CAP/Lionico$NEW_CAP/g" {} +
          find . -type f \( -name "*.kt" -o -name "*.xml" \) -exec sed -i "s/Theme\.Lionico\.$OLD_CAP/Theme.Lionico.$NEW_CAP/g" {} +

      - name: Rename Directory Structure
        run: |
          echo "=== Renaming directory structure across all modules ==="
          # Find all directories named after the old project name within the package structure
          find . -type d -name "$OLD_NAME" -path "*/src/*/java/com/lionico/*" | while read -r dir; do
            parent=$(dirname "$dir")
            new_dir="$parent/$NEW_NAME"
            echo "Moving $dir to $new_dir"
            mkdir -p "$new_dir"
            mv "$dir"/* "$new_dir/"
            rmdir "$dir"
          done

      - name: Verify and Commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "Refactor: Rename project to $APP_NAME (package: com.lionico.$NEW_NAME)"
            git push origin ${{ github.ref_name }}
          fi

      - name: Summary
        run: |
          echo "✅ Renaming Complete"
          echo "Package: com.lionico.$NEW_NAME"
          echo "App Name: $APP_NAME"
